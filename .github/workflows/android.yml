name: Build HudaWay APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate Android platform
        run: |
          set -euo pipefail
          rm -rf /tmp/hudaway_android
          flutter create /tmp/hudaway_android --platforms android --org com.hudaway --project-name hudaway
          test -f /tmp/hudaway_android/android/app/src/main/AndroidManifest.xml
          rm -rf android
          cp -a /tmp/hudaway_android/android ./android
          cp /tmp/hudaway_android/.metadata ./.metadata
          cp /tmp/hudaway_android/analysis_options.yaml ./analysis_options.yaml
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/build.gradle.kts
      - name: Prepare Quran and Adhan assets
        run: |
          set -euo pipefail
          mkdir -p assets/data android/app/src/main/res/raw
          curl -fsSL --retry 3 https://api.alquran.cloud/v1/quran/quran-uthmani -o assets/data/quran.json
          python3 - <<'PY'
          import json
          data=json.load(open('assets/data/quran.json',encoding='utf-8'))
          surahs=data.get('data',{}).get('surahs',[])
          assert len(surahs)==114
          assert sum(len(s.get('ayahs',[])) for s in surahs)==6236
          PY
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import subprocess
          base='https://raw.githubusercontent.com/Kiwifu/adhan-mp3/main/'
          files={'adhan_kuwait.mp3':'Adhan_Kuwait_(أذان_الكويت).mp3','adhan_dubai.mp3':'Adhan_Dubai_UAE_(أذان_دبي_الإمارات).mp3','adhan_fajr.mp3':'Adhan_Fajr_Al_Haram_Al_Maki_(أذان_الفجر_الحرم_المكي).mp3'}
          for out,src in files.items():
            target=Path('android/app/src/main/res/raw')/out
            subprocess.run(['curl','-fsSL','--retry','3',base+quote(src,safe='/()_-'),'-o',str(target)],check=True)
            assert target.stat().st_size>1000
          PY
      - name: Configure Android
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest=Path('android/app/src/main/AndroidManifest.xml'); s=manifest.read_text(); marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions='''\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n'''
          if 'ACCESS_FINE_LOCATION' not in s:s=s.replace(marker,marker+permissions)
          s=re.sub(r'android:label="[^"]+"','android:label="HudaWay"',s,count=1); s=re.sub(r'android:icon="[^"]+"','android:icon="@drawable/hudaway_logo"',s,count=1); manifest.write_text(s)
          drawable=Path('android/app/src/main/res/drawable'); drawable.mkdir(parents=True,exist_ok=True)
          (drawable/'hudaway_logo.xml').write_text('''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#D96B00" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#FFFFFF" android:pathData="M54,18A36,36 0,1 0,54 90A36,36 0,1 0,54 18"/><path android:fillColor="#D96B00" android:pathData="M60,25A29,29 0,1 0,60 83A29,29 0,1 1,60 25"/><path android:fillColor="#FFFFFF" android:pathData="M25,61c5,-17 16,-27 29,-27 13,0 24,10 29,27H25zM28,62h52v25H28zM20,87h68v8H20z"/></vector>''')
          gradle=Path('android/app/build.gradle.kts'); x=gradle.read_text().replace('compileSdk = flutter.compileSdkVersion','compileSdk = 36')
          x='\n'.join([line for line in x.splitlines() if 'isCoreLibraryDesugaringEnabled' not in line and 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs' not in line])+'\n'
          x=x.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          dep='coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
          if dep not in x:
              if 'dependencies {' in x:x=x.replace('dependencies {','dependencies {\n    '+dep,1)
              else:x+='\n\ndependencies {\n    '+dep+'\n}\n'
          gradle.write_text(x)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi
      - name: Verify APK outputs
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-release.apk
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hudaway-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
      - name: Create GitHub Release v1.1.0
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.1.0 --yes 2>/dev/null || true
          gh release create v1.1.0 build/app/outputs/flutter-apk/*.apk --target "$GITHUB_SHA" --title "HudaWay v1.1.0" --notes "HudaWay v1.1.0: Quran, prayer times, Adhan alarms, Qibla, Hijri calendar, Duas, Dhikr, Ramadan tools and new branding."
