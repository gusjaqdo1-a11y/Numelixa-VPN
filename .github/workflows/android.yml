name: Build Numelixa Quran APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          rm -rf /tmp/numelixa_android
          flutter create /tmp/numelixa_android --platforms android --org com.numelixa --project-name numelixa_quran
          cp -R /tmp/numelixa_android/android ./android
          cp /tmp/numelixa_android/.metadata ./.metadata
          cp /tmp/numelixa_android/analysis_options.yaml ./analysis_options.yaml

      - name: Prepare Quran data
        run: |
          mkdir -p assets/data
          curl -fsSL --retry 3 https://api.alquran.cloud/v1/quran/quran-uthmani -o assets/data/quran.json
          python3 - <<'PY'
          import json
          with open('assets/data/quran.json', encoding='utf-8') as f:
              data=json.load(f)
          surahs=data.get('data',{}).get('surahs',[])
          assert len(surahs)==114, f'Expected 114 surahs, got {len(surahs)}'
          assert sum(len(s.get('ayahs',[])) for s in surahs) >= 6200
          print('Quran asset validated:', len(surahs), 'surahs')
          PY

      - name: Configure Android permissions and app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions='''\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n'''
          s=s.replace(marker, marker+permissions)
          s=s.replace('android:label="numelixa_quran"','android:label="Numelixa Quran"')
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: numelixa-quran-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Create GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/app/outputs/flutter-apk/*.apk --title "Numelixa Quran ${GITHUB_REF_NAME}" --generate-notes
