name: Build HudaWay APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair upgraded Dart sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          app = Path('lib/app.dart')
          lines = app.read_text().splitlines()
          target = next((i for i, line in enumerate(lines) if line.strip().startswith('@override Widget build(BuildContext context) => ListView') and i > 180), None)
          if target is None:
              raise SystemExit('PrayerPage build line was not found')
          payload = ' '
          replacement = base64.b64decode(payload).decode().splitlines()
          lines[target:target+1] = replacement
          app.write_text('\n'.join(lines) + '\n')
          services = Path('lib/services.dart')
          ss = services.read_text().replace('visibility: NotificationVisibility.public));', 'visibility: NotificationVisibility.public)));')
          services.write_text(ss)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- lib/app.dart lib/services.dart; then
            git add lib/app.dart lib/services.dart
            git commit -m 'fix: finalize Dart source repairs [skip ci]'
            git push
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          set -euo pipefail
          rm -rf /tmp/hudaway_android
          flutter create /tmp/hudaway_android --platforms android --org com.hudaway --project-name hudaway
          test -f /tmp/hudaway_android/android/app/src/main/AndroidManifest.xml
          rm -rf ./android
          cp -a /tmp/hudaway_android/android ./android
          cp /tmp/hudaway_android/.metadata ./.metadata
          cp /tmp/hudaway_android/analysis_options.yaml ./analysis_options.yaml
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/build.gradle.kts

      - name: Prepare Quran and Adhan assets
        run: |
          set -euo pipefail
          mkdir -p assets/data android/app/src/main/res/raw
          curl -fsSL --retry 3 https://api.alquran.cloud/v1/quran/quran-uthmani -o assets/data/quran.json
          python3 - <<'PY'
          import json
          with open('assets/data/quran.json', encoding='utf-8') as f:
              data = json.load(f)
          surahs = data.get('data', {}).get('surahs', [])
          assert len(surahs) == 114, len(surahs)
          assert sum(len(s.get('ayahs', [])) for s in surahs) == 6236
          assert all(s.get('ayahs') for s in surahs)
          print('Quran asset validated: 114 surahs / 6236 ayahs')
          PY
          python3 - <<'PY'
          from urllib.parse import quote
          from pathlib import Path
          import subprocess
          base = 'https://raw.githubusercontent.com/Kiwifu/adhan-mp3/main/'
          files = {
              'adhan_kuwait.mp3': 'Adhan_Kuwait_(أذان_الكويت).mp3',
              'adhan_dubai.mp3': 'Adhan_Dubai_UAE_(أذان_دبي_الإمارات).mp3',
              'adhan_fajr.mp3': 'Adhan_Fajr_Al_Haram_Al_Maki_(أذان_الفجر_الحرم_المكي).mp3',
          }
          for out, src in files.items():
              url = base + quote(src, safe='/()_-')
              target = Path('android/app/src/main/res/raw') / out
              subprocess.run(['curl','-fsSL','--retry','3',url,'-o',str(target)], check=True)
              assert target.stat().st_size > 1000
          PY

      - name: Configure Android
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.is_file():
              raise SystemExit('AndroidManifest.xml was not generated')
          s = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
          '''
          if 'ACCESS_FINE_LOCATION' not in s:
              s = s.replace(marker, marker + permissions)
          s = s.replace('android:label="hudaway"','android:label="HudaWay"').replace('android:label="hudaway_android"','android:label="HudaWay"')
          s = re.sub(r'android:icon="[^"]+"','android:icon="@drawable/hudaway_logo"',s,count=1)
          manifest.write_text(s)

          drawable = Path('android/app/src/main/res/drawable')
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable/'hudaway_logo.xml').write_text('''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#D96B00" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#FFFFFF" android:pathData="M54,18A36,36 0,1 0,54 90A36,36 0,1 0,54 18"/><path android:fillColor="#D96B00" android:pathData="M60,25A29,29 0,1 0,60 83A29,29 0,1 1,60 25"/><path android:fillColor="#FFFFFF" android:pathData="M25,61c5,-17 16,-27 29,-27 13,0 24,10 29,27H25zM28,62h52v25H28zM20,87h68v8H20z"/><path android:fillColor="#D96B00" android:pathData="M31,67h46v4H31zM29,76h50v4H29zM26,85h56v4H26z"/><path android:fillColor="#FFFFFF" android:pathData="M54,34V22h-3v12z"/><path android:fillColor="#FFFFFF" android:pathData="M54,12a8,8 0,1 0,8 8 10,10 0,1 1,-8,-8z"/><path android:fillColor="#FFFFFF" android:pathData="M54,16l2,4 5,1 -4,3 1,5 -4,-3 -4,3 1,-5 -4,-3 5,-1z"/></vector>''')

          gradle = Path('android/app/build.gradle.kts')
          x = gradle.read_text().replace('compileSdk = flutter.compileSdkVersion','compileSdk = 36')
          lines = [line for line in x.splitlines() if 'isCoreLibraryDesugaringEnabled' not in line and 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs' not in line]
          x = '\n'.join(lines) + '\n'
          if 'compileOptions {' not in x:
              raise SystemExit('compileOptions block missing')
          x = x.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          if 'dependencies {' in x:
              x = x.replace('dependencies {','dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")',1)
          else:
              x += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          gradle.write_text(x)
          PY

      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: if [ -d test ]; then flutter test; else echo 'No tests; continuing'; fi
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi
      - name: Verify APK outputs
        run: |
          set -e
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-release.apk
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hudaway-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
      - name: Create GitHub Release v1.1.0 from main build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo 'HudaWay v1.1.0 already exists; skipping release creation.'
          else
            gh release create v1.1.0 build/app/outputs/flutter-apk/*.apk --target "$GITHUB_SHA" --title "HudaWay v1.1.0" --notes "Major HudaWay upgrade.\n\n- Complete Quran with continuous Mushaf-style reader\n- Full-surah Quran audio and adjustable Arabic font\n- GPS-based prayer times with city/country display\n- Live Qibla compass that follows phone rotation\n- Multiple Adhan sounds and 7-day exact alarm scheduling\n- Hijri 1448+ calendar with optional lock-screen display\n- Expanded Duas & Adhkar\n- Dhikr / Tasbeeh\n- Ramadan features unlock automatically in Hijri month 9\n- New HudaWay orange crescent/Quran branding\n- Expanded settings for calculation method, madhab, alarms and lock screen"
          fi
      - name: Create GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/app/outputs/flutter-apk/*.apk --title "HudaWay ${GITHUB_REF_NAME}" --generate-notes
