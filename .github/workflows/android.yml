name: Build HudaWay APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair Dart sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app=Path('lib/app.dart'); lines=app.read_text().splitlines()
          rstart=next(i for i,line in enumerate(lines) if line.startswith('class _ReaderPageState'))
          rend=next(i for i in range(rstart,len(lines)) if lines[i].startswith('class PrayerPage'))
          reader="class _ReaderPageState extends State<ReaderPage> { double fontSize=31; bool playing=false; final AudioPlayer audio=AudioPlayer(); @override void dispose(){audio.dispose();super.dispose();} Future<void> _play() async { try { if(playing){await audio.stop();setState(()=>playing=false);return;} await audio.play(UrlSource('https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${widget.surah.number}.mp3')); setState(()=>playing=true); audio.onPlayerComplete.first.then((_){if(mounted)setState(()=>playing=false);}); } catch(_){if(mounted)ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('Quran audio is temporarily unavailable.')));} } @override Widget build(BuildContext context){ final pages=<int,List<Ayah>>{}; for(final a in widget.surah.verses){pages.putIfAbsent(a.page,()=>[]).add(a);} return Scaffold(backgroundColor:paper,appBar:AppBar(backgroundColor:paper,foregroundColor:Colors.black87,title:Text(widget.surah.englishName),actions:[IconButton(onPressed:_play,icon:Icon(playing?Icons.stop_circle:Icons.play_circle,color:forest)),IconButton(onPressed:()=>setState(()=>fontSize=(fontSize+2).clamp(22,48)),icon:const Icon(Icons.text_increase)),IconButton(onPressed:()=>setState(()=>fontSize=(fontSize-2).clamp(22,48)),icon:const Icon(Icons.text_decrease))]),body:ListView(padding:const EdgeInsets.fromLTRB(16,12,16,36),children:[Text(widget.surah.name,textAlign:TextAlign.center,style:const TextStyle(color:Colors.black87,fontSize:34,fontWeight:FontWeight.bold)),Text(widget.surah.translation,textAlign:TextAlign.center,style:const TextStyle(color:Colors.black54)),if(widget.surah.number!=1&&widget.surah.number!=9)const Padding(padding:EdgeInsets.all(12),child:Text('بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ',textAlign:TextAlign.center,style:TextStyle(color:Colors.black87,fontSize:27))),...pages.entries.map((entry)=>Container(margin:const EdgeInsets.only(bottom:14),padding:const EdgeInsets.all(16),decoration:BoxDecoration(color:Colors.white,borderRadius:BorderRadius.circular(6),boxShadow:const[BoxShadow(blurRadius:4,color:Color(0x18000000))]),child:Directionality(textDirection:TextDirection.rtl,child:Text(entry.value.map((a)=>'${a.text} ۝${a.numberInSurah}').join('  '),textAlign:TextAlign.justify,style:TextStyle(color:Colors.black87,fontSize:fontSize,height:2.1)))))]); } }"
          lines[rstart:rend]=[reader]
          pstart=next(i for i,line in enumerate(lines) if line.startswith('class _PrayerPageState'))
          pend=next(i for i in range(pstart,len(lines)) if lines[i].startswith('class QiblaPage'))
          prayer="class _PrayerPageState extends State<PrayerPage> { List<PrayerEntry>? prayers; String place='Location not set'; bool loading=false; String method='Muslim World League'; String madhab='Shafi'; @override void initState(){super.initState();_load();} Future<void> _load() async {method=await Preferences.prayerMethod();madhab=await Preferences.madhab();if(mounted){setState((){});await load();}} Future<void> load() async {if(loading)return;setState(()=>loading=true);try{final service=PrayerService();await service.localZone();final pos=await service.location();if(pos==null)throw Exception('Turn on GPS and allow location permission.');final list=service.calculate(pos.latitude,pos.longitude,DateTime.now(),method:method,madhab:madhab=='Hanafi'?Madhab.hanafi:Madhab.shafi);final name=await service.reversePlace(pos.latitude,pos.longitude);await widget.alarms.scheduleNextDays(service,days:7);if(mounted)setState((){prayers=list;place=name;});}catch(e){if(mounted)ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text('$e')));}finally{if(mounted)setState(()=>loading=false);}} @override Widget build(BuildContext context)=>ListView(padding:const EdgeInsets.all(18),children:[Row(children:[const Expanded(child:Text('Prayer Times',style:TextStyle(fontSize:30,fontWeight:FontWeight.w900))),IconButton(onPressed:loading?null:load,icon:const Icon(Icons.refresh,color:gold))]),appBox(Row(children:[const Icon(Icons.location_on,color:gold),const SizedBox(width:10),Expanded(child:Text(place)),IconButton(onPressed:load,icon:const Icon(Icons.my_location))])),const SizedBox(height:12),if(prayers==null)appBox(Column(children:[const Text('Allow location to calculate your local prayer times.',textAlign:TextAlign.center),const SizedBox(height:12),FilledButton(onPressed:loading?null:load,child:Text(loading?'Loading…':'Use my location'))]))else ...prayers!.map((p)=>appBox(ListTile(leading:Icon(p.name=='Sunrise'?Icons.wb_sunny:Icons.mosque,color:gold),title:Text(p.name),subtitle:Text(p.arabic),trailing:Text(DateFormat('h:mm a').format(p.time),style:const TextStyle(color:gold,fontWeight:FontWeight.bold))))),OutlinedButton.icon(onPressed:()=>Navigator.push(context,MaterialPageRoute<void>(builder:(_)=>AlarmSettingsPage(alarms:widget.alarms))),icon:const Icon(Icons.notifications_active),label:const Text('Adhan & Alarm Settings'))]);}"
          lines[pstart:pend]=[prayer]
          app.write_text('\n'.join(lines)+'\n')
          services=Path('lib/services.dart'); services.write_text(services.read_text().replace('visibility: NotificationVisibility.public));','visibility: NotificationVisibility.public)));'))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- lib/app.dart lib/services.dart; then
            git add lib/app.dart lib/services.dart
            git commit -m 'fix: replace Reader and Prayer state with compile-safe code [skip ci]'
            git push
          fi
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate Android platform
        run: |
          set -euo pipefail
          rm -rf /tmp/hudaway_android
          flutter create /tmp/hudaway_android --platforms android --org com.hudaway --project-name hudaway
          test -f /tmp/hudaway_android/android/app/src/main/AndroidManifest.xml
          rm -rf android
          cp -a /tmp/hudaway_android/android ./android
          cp /tmp/hudaway_android/.metadata ./.metadata
          cp /tmp/hudaway_android/analysis_options.yaml ./analysis_options.yaml
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/build.gradle.kts
      - name: Prepare Quran and Adhan assets
        run: |
          set -euo pipefail
          mkdir -p assets/data android/app/src/main/res/raw
          curl -fsSL --retry 3 https://api.alquran.cloud/v1/quran/quran-uthmani -o assets/data/quran.json
          python3 - <<'PY'
          import json
          data=json.load(open('assets/data/quran.json',encoding='utf-8')); surahs=data.get('data',{}).get('surahs',[])
          assert len(surahs)==114; assert sum(len(s.get('ayahs',[])) for s in surahs)==6236
          PY
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import subprocess
          base='https://raw.githubusercontent.com/Kiwifu/adhan-mp3/main/'
          files={'adhan_kuwait.mp3':'Adhan_Kuwait_(أذان_الكويت).mp3','adhan_dubai.mp3':'Adhan_Dubai_UAE_(أذان_دبي_الإمارات).mp3','adhan_fajr.mp3':'Adhan_Fajr_Al_Haram_Al_Maki_(أذان_الفجر_الحرم_المكي).mp3'}
          for out,src in files.items():
            target=Path('android/app/src/main/res/raw')/out; subprocess.run(['curl','-fsSL','--retry','3',base+quote(src,safe='/()_-'),'-o',str(target)],check=True); assert target.stat().st_size>1000
          PY
      - name: Configure Android
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          m=Path('android/app/src/main/AndroidManifest.xml'); s=m.read_text(); marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms='''\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n'''
          if 'ACCESS_FINE_LOCATION' not in s:s=s.replace(marker,marker+perms)
          s=re.sub(r'android:label="[^"]+"','android:label="HudaWay"',s,count=1); s=re.sub(r'android:icon="[^"]+"','android:icon="@drawable/hudaway_logo"',s,count=1); m.write_text(s)
          d=Path('android/app/src/main/res/drawable'); d.mkdir(parents=True,exist_ok=True)
          (d/'hudaway_logo.xml').write_text('''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#D96B00" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#FFFFFF" android:pathData="M54,18A36,36 0,1 0,54 90A36,36 0,1 0,54 18"/><path android:fillColor="#D96B00" android:pathData="M60,25A29,29 0,1 0,60 83A29,29 0,1 1,60 25"/><path android:fillColor="#FFFFFF" android:pathData="M25,61c5,-17 16,-27 29,-27 13,0 24,10 29,27H25zM28,62h52v25H28zM20,87h68v8H20z"/><path android:fillColor="#D96B00" android:pathData="M31,67h46v4H31zM29,76h50v4H29zM26,85h56v4H26z"/></vector>''')
          g=Path('android/app/build.gradle.kts'); x=g.read_text().replace('compileSdk = flutter.compileSdkVersion','compileSdk = 36'); x='\n'.join([line for line in x.splitlines() if 'isCoreLibraryDesugaringEnabled' not in line and 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs' not in line])+'\n'; x=x.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1); x=x.replace('dependencies {','dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")',1); g.write_text(x)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi
      - name: Verify APK outputs
        run: |
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-release.apk
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hudaway-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
      - name: Create GitHub Release v1.1.0 from main build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.1.0 --yes 2>/dev/null || true
          gh release create v1.1.0 build/app/outputs/flutter-apk/*.apk --target "$GITHUB_SHA" --title "HudaWay v1.1.0" --notes "Major HudaWay upgrade: Quran reader, Qibla compass, prayer times, Adhan alarms, Hijri calendar, Duas, Dhikr, Ramadan tools and new branding."
